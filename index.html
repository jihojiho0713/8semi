<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웨이퍼 러너 - 반도체 8대 공정</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">◈</span><span>WAFER RUNNER</span></div>
      <div class="hud"><span id="stageCount">준비 중</span><span class="score-chip">SCORE <b id="score">0</b></span></div>
    </header>

    <main id="app">
      <section id="startScreen" class="screen start-screen">
        <div class="hero-orbit"><div class="orbit-dot"></div><div class="wafer-hero">◉</div></div>
        <p class="eyebrow">SEMICONDUCTOR QUEST · PROJECT 02</p>
        <h1>반도체 공정,<br><em>게임으로 돌파하기</em></h1>
        <p class="lead">잉곳부터 패키징까지, 서로 다른 8개의 미션으로<br>반도체가 만들어지는 과정을 직접 체험해 봐.</p>
        <button id="startBtn" class="primary-btn">공정 투어 시작 <span>→</span></button>
        <div class="start-note">총 8개 스테이지 · 자유 선택 가능 · 별명 입력 없음</div>
      </section>

      <section id="gameScreen" class="screen hidden">
        <div class="progress-track"><div id="progressBar"></div></div>
        <div class="stage-layout">
          <aside class="stage-list" id="stageList"></aside>
          <section class="game-panel">
            <div class="panel-heading"><div><p class="eyebrow" id="stageEyebrow"></p><h2 id="stageTitle"></h2></div><span id="stageNo" class="stage-no"></span></div>
            <p id="stageDesc" class="stage-desc"></p>
            <div id="visualGuide" class="visual-guide"></div>
            <div id="gameArea" class="game-area"></div>
            <div id="feedback" class="feedback"></div>
            <button id="nextBtn" class="next-btn hidden">다음 공정으로 <span>→</span></button>
          </section>
        </div>
      </section>

      <section id="quizScreen" class="screen hidden quiz-screen">
        <div class="quiz-card"><div class="quiz-icon">?</div><p class="eyebrow">CHECKPOINT QUIZ</p><h2 id="quizQuestion"></h2><div id="quizOptions" class="quiz-options"></div><div id="quizFeedback"></div></div>
      </section>

      <section id="finishScreen" class="screen hidden finish-screen">
        <div class="finish-badge">✓</div><p class="eyebrow">MISSION REPORT</p><h1>미션 리포트</h1>
        <p class="lead">원하는 공정부터 도전하면서 나만의 반도체 공정 지도를 완성했어.</p>
        <div class="final-score"><span>최종 점수</span><strong id="finalScore">0</strong><small>점</small></div>
        <p id="finishSummary" class="mission-tip"></p>
        <button id="restartBtn" class="primary-btn">처음부터 다시 <span>↻</span></button>
      </section>
    </main>
  </div>
  <script src="./script.js"></script>
</body>
</html>
