<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Don't Wafer Around! - 반도체 8대 공정</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeBtn" type="button" aria-label="시작 화면으로"><span class="brand-mark">◈</span><span>DON'T WAFER AROUND!</span></button>
      <div class="hud">
        <span id="stageCount"></span>
        <span class="score-chip">SCORE <b id="score">0</b></span>
        <button class="primary-btn topbar-start" id="startBtnTop" type="button">공정 투어 시작 <span>→</span></button>
        <button class="nav-toggle hidden" id="navBtn" type="button" aria-label="공정 이동 메뉴" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </header>

    <main id="app">
      <section id="startScreen" class="screen start-screen">
        <p class="eyebrow">PLAY &amp; LEARN · 반도체 8대 공정</p>
        <h1>반도체 공정,<br><em>게임으로 학습하기</em></h1>
        <button id="startBtn" class="primary-btn">공정 투어 시작 <span>→</span></button>
        <button id="resetBtn" class="sort-btn start-reset hidden" type="button">처음부터 다시 시작</button>

        <div class="process-map">
          <div class="pm-head">
            <h2 class="pm-title">한 눈에 보는 <em>반도체 8대 공정</em></h2>
            <p class="pm-hint"><b>공정 카드를 누르면</b> 그 공정 설명이 열려</p>
            <div class="pm-legend"><span class="pm-chip front">전공정</span><span class="pm-chip back">후공정</span></div>
          </div>

          <div class="pm-row">
            <button class="pm-node front" type="button" data-stage="0" aria-label="1번 공정 설명 보기" style="--i:0">
              <span class="pm-num">01</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><g class="pm-spin"><circle cx="32" cy="32" r="21" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="32" cy="32" r="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><circle cx="32" cy="32" r="4.5" fill="currentColor"/><path d="M26 12.5 32 18.5 38 12.5" fill="none" stroke="currentColor" stroke-width="2.5"/></g></svg>
              <span class="pm-name">웨이퍼 제조</span><span class="pm-tag">INGOT</span>
            </button>
            <span class="pm-arrow" style="--i:0.5">→</span>
            <button class="pm-node front" type="button" data-stage="1" aria-label="2번 공정 설명 보기" style="--i:1">
              <span class="pm-num">02</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><g class="pm-fall"><circle cx="19" cy="12" r="3.5" fill="currentColor"/><circle cx="32" cy="7" r="3.5" fill="currentColor"/><circle cx="45" cy="14" r="3.5" fill="currentColor"/></g><rect x="9" y="42" width="46" height="10" rx="2" fill="currentColor" opacity=".28"/><rect class="pm-film" x="9" y="32" width="46" height="9" rx="2" fill="currentColor" opacity=".85"/></svg>
              <span class="pm-name">산화</span><span class="pm-tag">OXIDIZE</span>
            </button>
            <span class="pm-arrow" style="--i:1.5">→</span>
            <button class="pm-node front" type="button" data-stage="2" aria-label="3번 공정 설명 보기" style="--i:2">
              <span class="pm-num">03</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><g class="pm-beam"><path d="M17 5v14M32 5v14M47 5v14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></g><rect x="11" y="23" width="42" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="9" y="40" width="46" height="12" rx="2" fill="currentColor" opacity=".35"/></svg>
              <span class="pm-name">포토</span><span class="pm-tag">PHOTO</span>
            </button>
            <span class="pm-arrow" style="--i:2.5">→</span>
            <button class="pm-node front" type="button" data-stage="3" aria-label="4번 공정 설명 보기" style="--i:3">
              <span class="pm-num">04</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 8v11M36 8v11M50 8v11" stroke="currentColor" stroke-width="2" opacity=".55"/><g class="pm-etch"><rect x="13" y="25" width="11" height="13" rx="1.5" fill="currentColor"/><rect x="29" y="25" width="11" height="13" rx="1.5" fill="currentColor"/><rect x="45" y="25" width="9" height="13" rx="1.5" fill="currentColor"/></g><rect x="8" y="39" width="48" height="13" rx="2" fill="currentColor" opacity=".3"/></svg>
              <span class="pm-name">식각</span><span class="pm-tag">ETCH</span>
            </button>
          </div>

          <div class="pm-turn"><span class="pm-arrow pm-arrow-down" style="--i:3.5">↓</span></div>

          <div class="pm-row pm-row-rev">
            <button class="pm-node back" type="button" data-stage="7" aria-label="8번 공정 설명 보기" style="--i:7">
              <span class="pm-num">08</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="13" y="25" width="38" height="27" rx="3" fill="currentColor" opacity=".38"/><path class="pm-lid" d="M11 26 32 13 53 26Z" fill="currentColor"/><path d="M22 35h20M22 44h20" stroke="var(--panel)" stroke-width="3.5" stroke-linecap="round"/></svg>
              <span class="pm-name">패키징</span><span class="pm-tag">PACK</span>
            </button>
            <span class="pm-arrow" style="--i:6.5">←</span>
            <button class="pm-node back" type="button" data-stage="6" aria-label="7번 공정 설명 보기" style="--i:6">
              <span class="pm-num">07</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><g opacity=".85"><rect x="10" y="10" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="26" y="10" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="42" y="10" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="26" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="26" y="26" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="42" y="26" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="42" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="26" y="42" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="42" y="42" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></g><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path class="pm-x pm-x1" d="M29 13l7 7M36 13l-7 7"/><path class="pm-x pm-x2" d="M45 45l7 7M52 45l-7 7"/><path class="pm-x pm-x3" d="M13 29l7 7M20 29l-7 7"/></g></svg>
              <span class="pm-name">EDS 테스트</span><span class="pm-tag">TEST</span>
            </button>
            <span class="pm-arrow" style="--i:5.5">←</span>
            <button class="pm-node front" type="button" data-stage="5" aria-label="6번 공정 설명 보기" style="--i:5">
              <span class="pm-num">06</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 46H24V22H40V46H56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".3"/><path class="pm-wire" d="M8 46H24V22H40V46H56" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="46" r="4.5" fill="currentColor"/><circle cx="56" cy="46" r="4.5" fill="currentColor"/></svg>
              <span class="pm-name">금속 배선</span><span class="pm-tag">CONNECT</span>
            </button>
            <span class="pm-arrow" style="--i:4.5">←</span>
            <button class="pm-node front" type="button" data-stage="4" aria-label="5번 공정 설명 보기" style="--i:4">
              <span class="pm-num">05</span>
              <svg class="pm-icon" viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="44" width="46" height="8" rx="2" fill="currentColor" opacity=".3"/><rect class="pm-stack pm-s1" x="9" y="34" width="46" height="8" rx="2" fill="currentColor" opacity=".5"/><rect class="pm-stack pm-s2" x="9" y="24" width="46" height="8" rx="2" fill="currentColor" opacity=".72"/><rect class="pm-stack pm-s3" x="9" y="14" width="46" height="8" rx="2" fill="currentColor"/></svg>
              <span class="pm-name">증착·이온주입</span><span class="pm-tag">LAYER</span>
            </button>
          </div>
        </div>
      </section>

      <section id="gameScreen" class="screen hidden">
        <div class="progress-track"><div id="progressBar"></div></div>
        <div class="stage-layout">
          <aside class="stage-list" id="stageList"></aside>
          <section class="game-panel">
            <div class="panel-heading">
              <span id="stageNo" class="stage-no"></span>
              <div class="panel-title"><p class="eyebrow" id="stageEyebrow"></p><h2 id="stageTitle"></h2></div>
              <button class="sort-btn" id="briefAgain" type="button">◈ 공정 설명 다시 보기</button>
            </div>
            <div id="visualGuide" class="visual-guide"></div>
            <div id="gameArea" class="game-area"></div>
            <div id="feedback" class="feedback"></div>
            <button id="nextBtn" class="next-btn hidden">다음 공정으로 <span>→</span></button>
          </section>
        </div>
      </section>

      <section id="quizScreen" class="screen hidden quiz-screen">
        <div class="quiz-card"><div class="quiz-icon">?</div><p class="eyebrow">CHECKPOINT QUIZ</p><h2 id="quizQuestion"></h2><div id="quizOptions" class="quiz-options"></div><div id="quizFeedback"></div></div>
      </section>

      <section id="finishScreen" class="screen hidden finish-screen">
        <div class="finish-badge">✓</div><p class="eyebrow">MISSION REPORT</p><h1>미션 리포트</h1>
        <div class="final-score"><span>최종 점수</span><strong id="finalScore">0</strong><small>점</small></div>
        <p id="finishSummary" class="mission-tip"></p>
        <button id="restartBtn" class="primary-btn">처음부터 다시 <span>↻</span></button>
      </section>
    </main>
  </div>

  <div class="nav-drawer hidden" id="navDrawer">
    <nav class="nav-panel" aria-label="공정 이동">
      <div class="nav-head">
        <span>공정 이동</span>
        <button class="nav-x" id="navClose" type="button" aria-label="메뉴 닫기">✕</button>
      </div>
      <div class="nav-list" id="navList"></div>
      <button class="sort-btn nav-home" id="navHome" type="button">◈ 시작 화면으로</button>
    </nav>
  </div>

  <div class="brief-overlay hidden" id="briefOverlay">
    <div class="brief-card" role="dialog" aria-modal="true" aria-labelledby="briefTitle" id="briefCard">
      <button class="brief-x" id="briefClose" type="button" aria-label="설명 닫기">✕</button>
      <div class="brief-head">
        <span class="brief-no" id="briefNo">01</span>
        <div>
          <p class="eyebrow" id="briefTag"></p>
          <h2 id="briefTitle"></h2>
        </div>
      </div>
      <div class="brief-body" id="briefBody"></div>
      <div class="brief-foot">
        <button class="primary-btn" id="briefStart" type="button">게임 시작 <span>→</span></button>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
